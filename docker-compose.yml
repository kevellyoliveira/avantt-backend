version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: avantt_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "monica28"
      MYSQL_DATABASE: "sistema_gestao"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # mount the schema so MySQL will execute it on first initialization
      - ./database/schema:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
