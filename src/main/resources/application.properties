spring.config.import=optional:file:./.env.properties

spring.datasource.url=jdbc:mysql://localhost:3306/sistema_gestao
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# SMTP is intentionally configured outside source control (.env.properties or environment variables).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
avantt.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
avantt.frontend-url=${FRONTEND_URL:http://localhost:8443}
# For Hibernate to work when JDBC metadata is not available at startup (DB down / missing driver),
# explicitly set the dialect. Adjust if you use a different MySQL version.
# Use a dialect class compatible with the Hibernate version pulled by Spring Boot.
# MySQL8Dialect may not exist in the Hibernate version on the classpath; use the
# generic MySQLDialect which is available across versions.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
