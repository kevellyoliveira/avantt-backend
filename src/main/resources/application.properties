spring.config.import=optional:file:./.env.properties

spring.datasource.url=jdbc:mysql://localhost:3306/task_manager
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# For Hibernate to work when JDBC metadata is not available at startup (DB down / missing driver),
# explicitly set the dialect. Adjust if you use a different MySQL version.
# Use a dialect class compatible with the Hibernate version pulled by Spring Boot.
# MySQL8Dialect may not exist in the Hibernate version on the classpath; use the
# generic MySQLDialect which is available across versions.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
